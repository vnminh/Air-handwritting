[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vni-airwriting"
version = "0.1.0"
description = "Conformer-CTC inference for Vietnamese air-writing trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "torch>=2.5,<3",
]

[project.scripts]
airwriting-infer = "airwriting.cli:main"

[tool.setuptools]
packages = ["airwriting"]
package-dir = {airwriting = "."}
include-package-data = true

[tool.setuptools.package-data]
airwriting = [
  "models/*.pt",
  "examples/*.csv",
  "assets/*.png",
]
